<!DOCTYPE html>
<html class="nut-full">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Daily Report - Bảng chấm công</title>

    <style id="report-style">
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 10pt;
            margin: 0;
            padding: 5px;
            color: #000;
        }

        .toolbar {
            width: 100%;
            padding: 5px;
            text-align: right;
            background: #f4f4f4;
            margin-bottom: 5px;
        }

        .export-button {
            display: inline-block;
            padding: 7px 13px;
            margin-left: 5px;
            border: 1px solid #777;
            background: #fff;
            color: #000;
            text-decoration: none;
            cursor: pointer;
            font-size: 10pt;
        }

        .export-button:hover {
            background: #e9e9e9;
        }

        /* Chiều rộng thực tế do JavaScript tính theo số ngày của tháng */
        #divReport {
            width: 3300px;
            background: #fff;
        }

        /* ===== Phần đầu báo cáo ===== */
        .report-title-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin: 0;
        }

        .report-title-table td {
            border: 0;
            padding: 0;
            vertical-align: middle;
        }

        .company-box {
            width: 505px;
            height: 175px;
            border-right: 1px solid #999 !important;
            border-bottom: 1px solid #000 !important;
            vertical-align: top !important;
            padding: 5px !important;
        }

        .company-logo {
            height: 88px;
            padding: 5px 5px 8px;
        }

        .company-logo img {
            width: 195px;
            height: 60px;
            object-fit: contain;
            object-position: left center;
        }

        .company-info {
            width: 100%;
            border-collapse: collapse;
            font-family: "Times New Roman", serif;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .company-info td {
            border: 0;
            padding: 2px 3px;
            height: 22px;
        }

        .company-info .info-label {
            width: 190px;
        }

        .company-info .info-colon {
            width: 15px;
            text-align: center;
        }

        .report-title-box {
            height: 175px;
            border-bottom: 1px solid #000 !important;
            text-align: left;
            vertical-align: bottom !important;
            padding: 0 10px 8px 45px !important;
        }

        #reportTitle {
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
            color: red;
            margin: 0;
            white-space: nowrap;
        }

        /* ===== Bảng chấm công ===== */
        .report-container {
            width: 100%;
            overflow: auto;
            max-height: 78vh;
        }

        #tblReport {
            table-layout: fixed;
            border-collapse: collapse;
            border-spacing: 0;
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: #000;
        }

        #tblReport th,
        #tblReport td {
            border: 1px solid #000;
            padding: 3px 4px;
            text-align: center;
            vertical-align: middle;
            overflow-wrap: break-word;
        }

        #tblReport thead th {
            background: #d9d9d9;
            font-weight: bold;
            white-space: normal;
            line-height: 1.2;
        }

        #tblReport thead tr:first-child th {
            height: 25px;
        }

        #tblReport thead tr:nth-child(2) th {
            height: 28px;
        }

        #tblReport tbody td {
            height: 26px;
            white-space: normal;
        }

        /* Họ và tên NVTT in đậm */
        #tblReport tbody td:nth-child(5) {
            font-weight: bold;
        }

        /* Màu nền theo khu vực (nhóm dòng) */
        #tblReport tbody tr.g0 td {
            background: #fff2cc;
        }

        #tblReport tbody tr.g1 td {
            background: #ddebf7;
        }

        #tblReport tbody tr.g2 td {
            background: #fce4f1;
        }

        /* Cột ngày: Chủ nhật màu xám, ngày lễ màu hồng (đặt SAU màu nhóm để đè lên) */
        #tblReport tbody tr td.sun {
            background: #e7e6e6;
        }

        #tblReport tbody tr td.hol {
            background: #ffccff;
        }

        /* Ghi chú của từng dòng căn trái */
        #tblReport tbody tr td.left {
            text-align: left;
        }

        /* Tổng ngày công */
        #tblReport thead th.tong,
        #tblReport tbody tr td.tong {
            background: #ffff00;
            font-weight: bold;
        }

        /* Dòng tổng cộng */
        #tblReport tbody tr.total-row td {
            background: #b4c6e7;
            font-weight: bold;
            height: 30px;
        }

        #tblReport tbody tr.total-row td.tong {
            background: #ffff00;
            font-size: 14px;
        }

        /* ===== Ghi chú ===== */
        .note-table {
            margin-top: 12px;
            border-collapse: collapse;
            font-family: "Times New Roman", serif;
            font-size: 10pt;
            font-weight: bold;
        }

        .note-table td {
            border: 0;
            padding: 1px 8px 1px 0;
            text-align: left;
        }

        .note-table td.note-label {
            width: 505px;
        }

        .note-table td.red {
            color: red;
        }

        .report-date {
            margin-top: 12px;
            font-style: italic;
            font-size: 10pt;
        }

        /* ===== In báo cáo ===== */
        @page {
            size: A4 landscape;
            margin: 5mm;
        }

        @media print {
            body {
                margin: 0;
                padding: 0;
            }

            .toolbar {
                display: none !important;
            }

            .report-container {
                overflow: visible;
                max-height: none;
            }

            #tblReport thead {
                display: table-header-group;
            }

            #tblReport tr {
                page-break-inside: avoid;
            }
        }
        @media screen {
            #divReport { width: 100%; }
            #tblReport thead th { position: sticky; z-index: 3; }
            #tblReport thead tr:first-child th { top: 0; }
            #tblReport thead tr:nth-child(2) th { top: 25px; }
        }
        /* Keep employee names on one line within their configured columns. */
        #tblReport tbody tr:not(.total-row) td:nth-child(4),
        #tblReport tbody tr:not(.total-row) td:nth-child(5) {
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            text-align: left;
        }
    </style>
    <script src="ReportFrozenColumns.js?v=20261114.1" defer></script>
<script src="ReportProvinceColors.js?v=20261119.1" defer></script>

<style>
@media print {
 html,body{height:auto!important;overflow:visible!important}
 body{width:var(--print-width);zoom:var(--print-zoom,1);margin:0;padding:0}
 #divReport,.report-title-table,.head-block{width:100%!important}
 #tblReport{zoom:1!important}
 .report-container{overflow:visible;max-height:none}
}

<script>
window.addEventListener('beforeprint', function () {
 var table = document.querySelector('#tblReport, #tblData');
 if (!table) return;
 document.body.style.removeProperty('--print-width');
 document.body.style.removeProperty('--print-zoom');
 var width = table.offsetWidth;
 document.body.style.setProperty('--print-width', width + 'px');
 document.body.style.setProperty('--print-zoom', (287 * 96 / 25.4 - 1) / width);
});
window.addEventListener('afterprint', function () {
 document.body.style.removeProperty('--print-width');
 document.body.style.removeProperty('--print-zoom');
});
</script>
</head>

<body>

    <div class="toolbar">
        <a class="export-button"
           href="#"
           onclick="exportExcel(); return false;">
            📊 Kết xuất Excel
        </a>

        <a class="export-button"
           href="#"
           onclick="window.print(); return false;">
            🖨️ In / Lưu PDF
        </a>
    </div>

    <div id="divReport">

        <!-- Logo, thông tin đơn vị và tiêu đề -->
        <table class="report-title-table">
            <tr>
                <td class="company-box">

                    <div class="company-logo">
                        <img
                           src="https://demo.zilcode.com/media/3/13/7/orit.jpg"
                            alt="ORIT Workforce">
                    </div>

                    <table class="company-info">
                        <tr>
                            <td class="info-label">Đơn vị Cung ứng</td>
                            <td class="info-colon">:</td>
                            <td>Công ty Cổ phần Đầu tư Orit</td>
                        </tr>

                        <tr>
                            <td class="info-label">Khu vực</td>
                            <td class="info-colon">:</td>
                            <td>
                                <span id="labKhuVuc"></span>
                            </td>
                        </tr>

                        <tr>
                            <td class="info-label">Giám đốc PTTT</td>
                            <td class="info-colon">:</td>
                            <td>
                                <span id="labGDCN">Hoàng Anh Tuấn + Võ Tuấn Bằng</span>
                            </td>
                        </tr>
                    </table>

                </td>

                <td class="report-title-box">
                    <h1 id="reportTitle">
                        DAILY REPORT - BẢNG CHẤM CÔNG THÁNG
                        <span id="labThangNam"></span>
                    </h1>
                </td>
            </tr>
        </table>

        <!-- Bảng dữ liệu -->
        <div class="report-container">

            <table id="tblReport" data-frozen-columns="8">

                <thead id="tblHead">
                    <!-- JavaScript sẽ tự sinh tiêu đề hai tầng -->
                </thead>

                <tbody id="tblData">
                    <!-- JavaScript sẽ tự đổ dữ liệu -->
                </tbody>

            </table>

        </div>

        <p class="report-date">
            <i id="labNgayBaoCao"></i>
        </p>

        <!-- Ghi chú
        <table class="note-table">
            <tr>
                <td colspan="2"><u>Ghi chú</u></td>
            </tr>

            <tr>
                <td class="note-label">1 ngày công làm việc:</td>
                <td class="red">: 1</td>
            </tr>

            <tr>
                <td class="note-label">1/2 ngày công làm việc:</td>

                <td class="red">: KL (yêu cầu phải có thông báo quản lý trực tiếp)</td>
            </tr>

            <tr>
                <td class="note-label">Ngày nghỉ không lương không lý do:</td>
                <td class="red">: KLO</td>
            </tr>
        </table> -->

    </div>

    <script>
        /* ===== Các hàm hỗ trợ cho xuất Excel ===== */

        // Chuyển rgb()/rgba() sang #rrggbb để Excel đọc được
        function toHex(color) {
            var m = (color || "").match(/rgba?\(([^)]+)\)/);
            if (!m) return color || "#000000";
            var p = m[1].split(",").map(function (s) { return parseFloat(s); });
            if (p.length === 4 && p[3] === 0) return "#ffffff";
            return "#" + p.slice(0, 3).map(function (n) {
                var h = Math.round(n).toString(16);
                return h.length < 2 ? "0" + h : h;
            }).join("");
        }

        function escHtml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function textOf(id) {
            var el = document.getElementById(id);
            return el ? el.textContent.replace(/\s+/g, " ").trim() : "";
        }

        // Gán style trực tiếp (inline) cho ô theo đúng màu/chữ đang hiển thị trên màn hình.
        // Excel không hiểu class/nth-child nên phải "đóng cứng" style vào từng ô.
        function styleCell(src, dst, isBody) {
            var cs = window.getComputedStyle(src);
            var st =
                "background:" + toHex(cs.backgroundColor) + ";" +
                "color:" + toHex(cs.color) + ";" +
                "font-family:Arial,sans-serif;" +
                "font-size:" + (parseFloat(cs.fontSize) * 0.75).toFixed(1) + "pt;" +
                "font-weight:" + cs.fontWeight + ";" +
                "font-style:" + cs.fontStyle + ";" +
                "text-align:" + (cs.textAlign === "start" ? "left" : cs.textAlign) + ";" +
                "vertical-align:middle;" +
                "border:.5pt solid #000000;" +
                "white-space:normal;word-wrap:break-word;";

            // Giữ nguyên dạng chữ (không bị Excel đổi 0.5, 1... thành ngày/số theo vùng miền)
            if (isBody) st += 'mso-number-format:"\\@";';

            dst.setAttribute("style", st);
            dst.removeAttribute("class");
            dst.removeAttribute("id");
            dst.removeAttribute("width");
            dst.removeAttribute("height");
        }

        // Nhân bản thead/tbody, đồng bộ style và chiều cao dòng
        function cloneSection(section, isBody) {
            var c = section.cloneNode(true);
            var srcRows = section.rows;
            var dstRows = c.rows;

            for (var i = 0; i < srcRows.length; i++) {
                dstRows[i].removeAttribute("id");
                dstRows[i].removeAttribute("class");
                dstRows[i].setAttribute("style", "height:" + srcRows[i].offsetHeight + "px;");

                for (var j = 0; j < srcRows[i].cells.length; j++) {
                    styleCell(srcRows[i].cells[j], dstRows[i].cells[j], isBody);
                }
            }
            return c.innerHTML;
        }

        function exportExcel() {

            var table = document.getElementById("tblReport");
            var thead = table ? table.tHead : null;
            var tbody = table ? table.tBodies[0] : null;

            if (!table || !thead || !thead.rows.length || !tbody || !tbody.rows.length) {
                alert("Không tìm thấy dữ liệu báo cáo!");
                return;
            }

            /* ---- Số cột và độ rộng từng cột (lấy theo dòng dữ liệu đầu tiên) ---- */
            var firstRow = tbody.rows[0];
            var totalCols = firstRow.cells.length;
            var widths = [];

            for (var i = 0; i < totalCols; i++) {
                widths.push(firstRow.cells[i].offsetWidth);
            }

            var LEFT_COLS = 5;                       // khối logo/đơn vị chiếm 5 cột đầu (STT → Họ tên NVTT)
            var titleCols = Math.max(totalCols - LEFT_COLS, 1);

            var colgroup = "<colgroup>";
            widths.forEach(function (w) {
                colgroup += '<col width="' + w + '" style="width:' + w + 'px">';
            });
            colgroup += "</colgroup>";

            /* ---- Khối đầu báo cáo ---- */
            var logoEl = document.querySelector(".company-logo img");
            var logoSrc = logoEl ? logoEl.src : "";   // .src luôn là đường dẫn tuyệt đối

            var titleText = textOf("reportTitle");

            var infoFont =
                "font-family:'Times New Roman',serif;font-size:12pt;font-weight:bold;" +
                "color:#000000;text-align:left;vertical-align:middle;white-space:nowrap;";

            var leftBorder = "border:none;border-right:1px solid #999999;";
            var lastBorder = "border:none;border-right:1px solid #999999;border-bottom:1px solid #000000;";

            var infoRows = [
                ["Đơn vị Cung ứng", "Công ty Cổ phần Đầu tư Orit"],
                ["Khu vực", textOf("labKhuVuc")],
                ["Giám đốc PTTT", textOf("labGDCN")]
            ];

            var top = "";

            // Dòng 1: logo (trái) + tiêu đề đỏ (phải, gộp 4 dòng)
            top +=
                '<tr style="height:85px">' +
                    '<td colspan="' + LEFT_COLS + '" style="' + leftBorder +
                        'vertical-align:top;text-align:left;padding:5px;">' +
                        (logoSrc ? '<img src="' + logoSrc + '" width="195" height="60">' : "") +
                    '</td>' +
                    '<td colspan="' + titleCols + '" rowspan="4" style="' +
                        'border:none;border-bottom:1px solid #000000;' +
                        'font-family:Arial,sans-serif;font-size:22pt;font-weight:bold;font-style:italic;' +
                        'color:#ff0000;text-align:left;vertical-align:bottom;white-space:nowrap;">' +
                        escHtml(titleText) +
                    '</td>' +
                '</tr>';

            // Dòng 2-4: Đơn vị cung ứng / Khu vực / Giám đốc PTTT
            infoRows.forEach(function (r, idx) {
                var last = idx === infoRows.length - 1;
                top +=
                    '<tr style="height:30px">' +
                        '<td colspan="3" style="' + infoFont + 'border:none;' +
                            (last ? 'border-bottom:1px solid #000000;' : '') + '">' +
                            escHtml(r[0]) +
                        '</td>' +
                        '<td colspan="2" style="' + infoFont + (last ? lastBorder : leftBorder) + '">: ' +
                            escHtml(r[1]) +
                        '</td>' +
                    '</tr>';
            });

            /* ---- Bảng dữ liệu ---- */
            var headHtml = cloneSection(thead, false);
            var bodyHtml = cloneSection(tbody, true);

            /* ---- Chân báo cáo: ngày báo cáo + ghi chú ---- */
            var bottom = "";
            var blankRow = '<tr><td colspan="' + totalCols + '" style="border:none;height:12px"></td></tr>';

            bottom += blankRow;

            bottom +=
                '<tr><td colspan="' + totalCols + '" style="border:none;' +
                'font-family:Arial,sans-serif;font-size:10pt;font-style:italic;text-align:left;">' +
                escHtml(textOf("labNgayBaoCao")) + '</td></tr>';

            bottom += blankRow;

            var noteFont =
                "border:none;font-family:'Times New Roman',serif;font-size:10pt;font-weight:bold;" +
                "text-align:left;vertical-align:middle;white-space:nowrap;";

            bottom +=
                '<tr><td colspan="' + LEFT_COLS + '" style="' + noteFont + 'text-decoration:underline;">' +
                'Ghi chú</td></tr>';

            [
                ["1 ngày công làm việc:", "1"],
                ["1/2 ngày công làm việc:", "0.5"],
                ["Ngày nghỉ theo quy định:", "N"],
                ["Ngày nghỉ không lương có lý do (ốm,...):", "KL (yêu cầu phải có thông báo quản lý trực tiếp)"],
                ["Ngày nghỉ không lương không lý do:", "KLO"]
            ].forEach(function (n) {
                bottom +=
                    '<tr>' +
                        '<td colspan="' + LEFT_COLS + '" style="' + noteFont + '">' + escHtml(n[0]) + '</td>' +
                        '<td colspan="8" style="' + noteFont + 'color:#ff0000;mso-number-format:\'\\@\';">: ' +
                            escHtml(n[1]) + '</td>' +
                    '</tr>';
            });

            /* ---- Ghép thành file Excel (HTML) ---- */
            var html =
                '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
                'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
                'xmlns="http://www.w3.org/TR/REC-html40">' +

                '<head>' +
                '<meta http-equiv="Content-Type" content="text/html; charset=utf-8">' +

                '<!--[if gte mso 9]>' +
                '<xml>' +
                    '<x:ExcelWorkbook>' +
                        '<x:ExcelWorksheets>' +
                            '<x:ExcelWorksheet>' +
                                '<x:Name>ChamCong</x:Name>' +
                                '<x:WorksheetOptions>' +
                                    '<x:DoNotDisplayGridlines/>' +
                                    '<x:FitToPage/>' +
                                    '<x:Print>' +
                                        '<x:FitWidth>1</x:FitWidth>' +
                                        '<x:FitHeight>0</x:FitHeight>' +
                                        '<x:ValidPrinterInfo/>' +
                                        '<x:PaperSizeIndex>9</x:PaperSizeIndex>' +
                                    '</x:Print>' +
                                '</x:WorksheetOptions>' +
                            '</x:ExcelWorksheet>' +
                        '</x:ExcelWorksheets>' +
                    '</x:ExcelWorkbook>' +
                '</xml>' +
                '<![endif]-->' +

                '<style>' +
                    'body{font-family:Arial,sans-serif;font-size:10pt;}' +
                    'table{border-collapse:collapse;table-layout:fixed;}' +
                    '@page{size:29.7cm 21cm;mso-page-orientation:landscape;margin:0.5cm;}' +
                '</style>' +

                '</head>' +

                '<body>' +
                    '<table border="0" cellpadding="0" cellspacing="0" ' +
                        'style="border-collapse:collapse;table-layout:fixed;">' +
                        colgroup +
                        top +
                        headHtml +
                        bodyHtml +
                        bottom +
                    '</table>' +
                '</body>' +
                '</html>';

            var blob = new Blob(
                ["\ufeff", html],
                { type: "application/vnd.ms-excel;charset=utf-8;" }
            );

            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");

            link.href = url;
            link.download = "DailyChamCong.xls";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(function () {
                URL.revokeObjectURL(url);
            }, 1500);
        }
    </script>

</body>
</html>
