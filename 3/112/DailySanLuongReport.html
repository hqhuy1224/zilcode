<!DOCTYPE html>
<html class="nut-full">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Báo cáo sản lượng</title>

    <style id="report-style">
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            font-size: 10pt;
            margin: 0;
            padding: 5px;
            color: #000;
        }

        .toolbar {
            padding: 5px;
            text-align: right;
            background: #f4f4f4;
            margin-bottom: 5px;
        }

        .export-button {
            display: inline-block;
            padding: 7px 13px;
            margin-left: 5px;
            border: 1px solid #777;
            background: #fff;
            color: #000;
            text-decoration: none;
            cursor: pointer;
            font-size: 10pt;
        }

        .export-button:hover { background: #e9e9e9; }

        #divReport { background: #fff; }

        /* ===== Phần đầu báo cáo ===== */
        .head-block {
            display: flex;
            align-items: flex-end;
            width: 1500px;
            height: 175px;
            border-bottom: 1px solid #000;
        }

        .company-box {
            width: 520px;
            height: 100%;
            padding: 5px;
        }

        .company-logo { height: 80px; padding: 3px 5px 6px; }

        .company-logo img {
            width: 195px;
            height: 60px;
            object-fit: contain;
            object-position: left center;
        }

        .company-info {
            border-collapse: collapse;
            font-family: "Times New Roman", serif;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .company-info td { border: 0; padding: 2px 3px; height: 22px; }
        .company-info .info-label { width: 160px; }
        .company-info .info-colon { width: 15px; text-align: center; }

        .title-box { padding: 0 10px 8px 20px; }

        #reportTitle {
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
            color: red;
            margin: 0;
            white-space: nowrap;
        }

        .unit-note {
            margin-top: 6px;
            font-size: 12px;
            font-style: italic;
            font-weight: bold;
            color: red;
        }

        /* ===== Bảng ===== */
        .report-container {
            overflow: auto;
            max-height: 78vh;
        }

        #tblReport {
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 10px;
            color: #000;
        }

        #tblReport th,
        #tblReport td {
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            padding: 3px 4px;
            text-align: center;
            vertical-align: middle;
            overflow-wrap: break-word;
        }

        #tblReport thead th {
            background: #d9d9d9;
            font-weight: bold;
            line-height: 1.15;
            position: sticky;
            z-index: 3;
            border-top: 1px solid #000;
        }

        #tblReport thead tr:first-child th { top: 0; height: 28px; }
        #tblReport thead tr:nth-child(2) th { top: 28px; height: 48px; font-size: 9px; }

        #tblReport th:first-child,
        #tblReport td:first-child { border-left: 1px solid #000; }

        #tblReport thead th.alt { background: #fde9d9; }
        #tblReport thead th.qd  { background: #ffe699; }
        #tblReport thead th.ctc { background: #c6e0b4; }

        #tblReport tbody td { height: 26px; background: #fff; }

        #tblReport tbody td.info { background: #fce4ec; }
        #tblReport tbody td.nm   { font-weight: bold; }
        #tblReport tbody td.alt  { background: #fde9d9; }
        #tblReport tbody td.qd   { background: #fff2cc; }
        #tblReport tbody td.ctc  { background: #e2efda; }
        #tblReport tbody td.tot  { font-weight: bold; }
        #tblReport tbody td.pc   { font-weight: bold; color: #c00000; }

        /* Dòng tổng cộng */
        #tblReport tbody tr.total-row td {
            background: #b4c6e7;
            font-weight: bold;
            height: 30px;
        }

        #tblReport tbody tr.total-row td.label {
            font-family: "Times New Roman", serif;
            font-size: 16px;
            text-align: center;
        }

        .report-date { margin-top: 10px; font-style: italic; font-size: 10pt; }

        /* ===== In ===== */
        @page { size: A4 landscape; margin: 5mm; }

        @media print {
            body { margin: 0; padding: 0; }
            .toolbar { display: none !important; }
            .report-container { overflow: visible; max-height: none; }
            #tblReport thead { display: table-header-group; }
            #tblReport tr { page-break-inside: avoid; }
        }
        /* Keep employee names on one line within their configured columns. */
        #tblReport tbody tr:not(.total-row) td:nth-child(4),
        #tblReport tbody tr:not(.total-row) td:nth-child(5) {
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            text-align: left;
        }
    </style>
    <script src="ReportFrozenColumns.js?v=20261114.1" defer></script>
<script src="ReportProvinceColors.js?v=20261119.1" defer></script>

<style>
@media print {
 html,body{height:auto!important;overflow:visible!important}
 body{width:var(--print-width);zoom:var(--print-zoom,1);margin:0;padding:0}
 #divReport,.report-title-table,.head-block{width:100%!important}
 #tblReport{zoom:1!important}
 .report-container{overflow:visible;max-height:none}
}
</style>
<script>
window.addEventListener('beforeprint', function () {
 var table = document.querySelector('#tblReport, #tblData');
 if (!table) return;
 document.body.style.removeProperty('--print-width');
 document.body.style.removeProperty('--print-zoom');
 var width = table.offsetWidth;
 document.body.style.setProperty('--print-width', width + 'px');
 document.body.style.setProperty('--print-zoom', (287 * 96 / 25.4 - 1) / width);
});
window.addEventListener('afterprint', function () {
 document.body.style.removeProperty('--print-width');
 document.body.style.removeProperty('--print-zoom');
});
</script>
</head>

<body>

    <div class="toolbar">
        <a class="export-button" href="#" onclick="exportExcel(); return false;">📊 Kết xuất Excel</a>
    </div>

    <div id="divReport">

        <div class="head-block">
            <div class="company-box">
                <div class="company-logo">
                    <img src="https://demo.zilcode.com/media/3/13/7/orit.jpg" alt="ORIT Workforce">
                </div>

                <table class="company-info">
                    <tr>
                        <td class="info-label">Đơn vị Cung ứng</td>
                        <td class="info-colon">:</td>
                        <td>Công ty Cổ phần Đầu tư Orit</td>
                    </tr>
                    <tr>
                        <td class="info-label">Khu vực</td>
                        <td class="info-colon">:</td>
                        <td><span id="labThiTruong"></span></td>
                    </tr>
                    <tr>
                        <td class="info-label">Giám đốc PTTT</td>
                        <td class="info-colon">:</td>
                        <td><span id="labGDCN"></span></td>
                    </tr>
                </table>
            </div>

            <div class="title-box">
                <h1 id="reportTitle">BÁO CÁO SẢN LƯỢNG THÁNG <span id="labThangNam"></span></h1>
                <div class="unit-note">*đơn vị tính: keg/chai/lon</div>
            </div>
        </div>

        <div class="report-container">
            <table id="tblReport" data-frozen-columns="8">
                <thead id="tblHead"><!-- JavaScript tự sinh tiêu đề --></thead>
                <tbody id="tblData"><!-- JavaScript tự đổ dữ liệu --></tbody>
            </table>
        </div>

        <p class="report-date"><i id="labNgayBaoCao"></i></p>

    </div>


    <script>
        /* Kết xuất Excel: dựng file .xls (HTML) từ bảng đang hiển thị, tô màu theo class */
        function exportExcel() {

            var table = document.getElementById("tblReport");
            var thead = table ? table.tHead : null;
            var tbody = table ? table.tBodies[0] : null;

            if (!table || !thead || !thead.rows.length || !tbody || !tbody.rows.length) {
                alert("Không tìm thấy dữ liệu báo cáo!");
                return;
            }

            function esc(s) {
                return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }
            function textOf(id) {
                var el = document.getElementById(id);
                return el ? el.textContent.replace(/\s+/g, " ").trim() : "";
            }

            var BASE = "border:.5pt solid #000000;font-family:Arial,sans-serif;font-size:9pt;" +
                       "text-align:center;vertical-align:middle;white-space:normal;";
            var HEAD = { "": "background:#d9d9d9;font-weight:bold;", alt: "background:#fde9d9;",
                         qd: "background:#ffe699;", ctc: "background:#c6e0b4;" };
            var BODY = { info: "background:#fce4ec;", nm: "font-weight:bold;", alt: "background:#fde9d9;",
                         qd: "background:#fff2cc;", ctc: "background:#e2efda;", tot: "font-weight:bold;",
                         pc: "font-weight:bold;color:#c00000;" };

            function rowsHtml(rows, kind) {
                var h = "";
                for (var i = 0; i < rows.length; i++) {
                    var tr = rows[i];
                    var isTotal = (tr.className || "").indexOf("total-row") >= 0;
                    h += "<tr>";
                    for (var j = 0; j < tr.cells.length; j++) {
                        var c = tr.cells[j];
                        var cls = (c.className || "").split(/\s+/);
                        var st = BASE;

                        if (kind === "head") {
                            st += HEAD[""];
                            cls.forEach(function (k) { if (k && HEAD[k]) st += HEAD[k]; });
                        } else if (isTotal) {
                            st += "background:#b4c6e7;font-weight:bold;";
                            if (cls.indexOf("label") >= 0) st += "font-family:'Times New Roman',serif;font-size:14pt;";
                        } else {
                            st += "background:#ffffff;";
                            cls.forEach(function (k) { if (k && BODY[k]) st += BODY[k]; });
                        }

                        if (c.hasAttribute("data-province-color")) st += "background:" + c.getAttribute("data-province-color") + ";";
                        h += "<td" +
                            (c.colSpan > 1 ? ' colspan="' + c.colSpan + '"' : "") +
                            (c.rowSpan > 1 ? ' rowspan="' + c.rowSpan + '"' : "") +
                            ' style="' + st + '">' + esc(c.textContent) + "</td>";
                    }
                    h += "</tr>";
                }
                return h;
            }

            /* độ rộng cột lấy từ colgroup */
            var cols = table.querySelectorAll("colgroup col");
            var colgroup = "<colgroup>";
            for (var i = 0; i < cols.length; i++) {
                var w = parseInt(cols[i].style.width, 10) || 60;
                colgroup += '<col width="' + w + '" style="width:' + w + 'px">';
            }
            colgroup += "</colgroup>";

            /* khối đầu báo cáo */
            var logo = document.querySelector(".company-logo img");
            var logoSrc = logo ? logo.src : "";
            var infoStyle = "border:none;font-family:'Times New Roman',serif;font-size:12pt;font-weight:bold;" +
                            "text-align:left;vertical-align:middle;white-space:nowrap;";
            var top = "";

            top += '<tr style="height:70px"><td colspan="5" style="border:none;text-align:left;vertical-align:top;">' +
                   (logoSrc ? '<img src="' + logoSrc + '" width="195" height="60">' : "") + "</td></tr>";

            [["Đơn vị Cung ứng", "Công ty Cổ phần Đầu tư Orit"],
             ["Khu vực", textOf("labThiTruong")],
             ["Giám đốc PTTT", textOf("labGDCN")]].forEach(function (r) {
                top += '<tr style="height:24px"><td colspan="3" style="' + infoStyle + '">' + esc(r[0]) + "</td>" +
                       '<td colspan="6" style="' + infoStyle + '">: ' + esc(r[1]) + "</td></tr>";
            });

            top += '<tr style="height:40px"><td colspan="12" style="border:none;font-family:Arial,sans-serif;' +
                   'font-size:20pt;font-weight:bold;font-style:italic;color:#ff0000;text-align:left;white-space:nowrap;">' +
                   esc(textOf("reportTitle")) + "</td></tr>";

            top += '<tr style="height:22px"><td colspan="12" style="border:none;font-family:Arial,sans-serif;' +
                   'font-size:10pt;font-weight:bold;font-style:italic;color:#ff0000;text-align:left;">' +
                   "*đơn vị tính: keg/chai/lon</td></tr>";

            var blank = '<tr><td colspan="12" style="border:none;height:10px"></td></tr>';
            var bottom = blank + '<tr><td colspan="12" style="border:none;font-family:Arial,sans-serif;' +
                         'font-size:10pt;font-style:italic;text-align:left;">' + esc(textOf("labNgayBaoCao")) + "</td></tr>";

            var html =
                '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
                'xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
                '<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8">' +
                "<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>" +
                "<x:Name>SanLuong</x:Name><x:WorksheetOptions><x:DoNotDisplayGridlines/><x:FitToPage/><x:Print><x:FitWidth>1</x:FitWidth><x:FitHeight>0</x:FitHeight><x:PaperSizeIndex>9</x:PaperSizeIndex></x:Print>" +
                "</x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets>" +
                
                "</x:ExcelWorkbook></xml><![endif]-->" +
                "<style>@page{size:29.7cm 21cm;mso-page-orientation:landscape;margin:0.5cm;}table{border-collapse:collapse;table-layout:fixed;}</style></head>" +
                '<body><table border="0" cellpadding="0" cellspacing="0">' +
                colgroup + top + rowsHtml(thead.rows, "head") + rowsHtml(tbody.rows, "body") + bottom +
                "</table></body></html>";

            var blob = new Blob(["\ufeff", html], { type: "application/vnd.ms-excel;charset=utf-8;" });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = "BaoCaoSanLuong.xls";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
        }
    </script>

</body>
</html>
